[package]
name = "lambo-gui"
description = "The Lambo PHP panel: the primary desktop interface. A thin shell over lambo-core; contains no business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "lambo-gui"
path = "src/main.rs"

[dependencies]
lambo-core.workspace = true

[dev-dependencies]
# The panel's unit tests build a real installation document on disk, which is
# what the engine's own tests use `testutil` for.
lambo-core = { workspace = true, features = ["testutil"] }

# The GUI is Win32, and Win32 is FFI. `unsafe_code = "forbid"` is the right
# default for the engine and the CLI, so it is overridden here rather than
# globally - see the note in src/win32.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    # `WNDCLASSW` and `RegisterClassW` are gated behind Gdi in windows-sys,
    # because a window class carries a background brush handle. The panel's own
    # painting - the cards, the strip, the tables - is Gdi too.
    "Win32_Graphics_Gdi",
    # `DwmSetWindowAttribute`, which rounds the window's corners and gives a dark
    # frame to a panel whose system preference is dark. Both were the original's.
    "Win32_Graphics_Dwm",
    # `GetDpiForWindow`, so the panel is laid out in the display's own pixels.
    "Win32_UI_HiDpi",
    # `Shell_NotifyIconW` and the tray's menu, which is how the window lives on
    # after it is closed. `SHBrowseForFolderW` is the folder picker the
    # projects page's `Browse…` opens.
    "Win32_UI_Shell",
    # `BROWSEINFOW` and the picker's two functions live in the shell's common
    # submodule, so the folder picker needs this next to `Win32_UI_Shell`.
    "Win32_UI_Shell_Common",
    # `CoTaskMemFree`, which frees the item-id list the folder picker returns.
    "Win32_System_Com",
    # `RegGetValueW`, for the system's light/dark preference. Lambo has no
    # setting of its own for this: it follows Windows, which is what a native
    # application does.
    "Win32_System_Registry",
    # `GetLocalTime`, which is where the log's timestamps come from.
    "Win32_System_SystemInformation",
    # `SS_LEFT` and `SS_NOPREFIX`, the static-control styles the labels are
    # created with.
    "Win32_System_SystemServices",
] }

# The workspace forbids unsafe code everywhere. A Win32 GUI cannot exist without
# it, so this crate opts out explicitly and locally instead of weakening the
# rule for the engine that does not need it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
# Win32 signatures are what they are; matching them is not a style choice.
too_many_arguments = "allow"
